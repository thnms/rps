<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: cornflowerblue;
            overflow: hidden;
        }

        #choices-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 50vh;
            left: 50vw;
            transform: translate(-50%, -50%);

            transition: top 1s ease-in-out,
                          left 1s ease-in-out;
            @starting-style {
                top: -100vh;
                left: -100vw;
                transform: none;
            }
        }

        #choices-viewer {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 50vh;
            left: 50vw;
            transform: translate(-50%, -50%);
        }

        .choices {
            width: 100px;
            height: 100px;
            transition: 
                width 1s ease-in-out,
                height 1s ease-in-out;

            @starting-style {
                width: 0px;
                height: 0px;
            }
            image-rendering: pixelated;
  
            /* Firefox */
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges; /* Legacy */

            border: none;
            background-color: transparent;
            padding: 0;
            cursor: pointer;
        }

        .choices.disappear {
            animation-name: choice-disappear;
            animation-duration: 1s;
            animation-fill-mode: forwards;
        }

        .choices.winner {
            animation-name: choice-winner;
            animation-duration: 1s;
            animation-fill-mode: forwards;
        }

        @keyframes choice-disappear {
            from {
                opacity: 1;
                display: inline;
            }

            to {
                opacity: 0;
                display: none;
            }
        }

        @keyframes choice-winner {
            from {
                width: 100px;
                height: 100px;
            }

            to {
                width: 200px;
                height: 200px;
            }
        }

        .choices img {
            object-fit: contain;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="choices-viewer" hidden>

    </div>
    <script>
        const choiceConstants = { "paper": 3, "rock": 2, "scissors": 1 };
        const choicesContainer = document.getElementById("choices-container");
        const choicesViewer = document.getElementById("choices-viewer");
        
        /** @type {HTMLElement[]} */
        const choices = [];

        function getChoiceNumber(element) {
            return choiceConstants[element.dataset.choice] ?? element.dataset.choice;
        }

        function loadChoices() {
            let nonsortedChoices = Array.from(document.getElementsByClassName("choices"));
            nonsortedChoices.sort((a, b) => getChoiceNumber(a) - getChoiceNumber(b));
            choices.push(...nonsortedChoices);

            choices.forEach((e) => {
                e.addEventListener('click', _ => {
                    handleChoice(e);
                });
            }); // 클릭 핸들러 등록
        }

        /** @param {HTMLElement} ele */
        function getAnimationEndPromise(ele) {
            return new Promise((resolve, reject) => {
                ele.addEventListener("animationend", (evt) => resolve(), { once: true });
            });
        }

        /** @param {HTMLElement} choiceElement */
        async function handleChoice(choiceElement) {
            let myChoiceElement = choices[Math.floor(Math.random() * choices.length)];
            let myChoice = getChoiceNumber(myChoiceElement);

            let userChoiceElement = choiceElement;
            let userChoice = getChoiceNumber(userChoiceElement);

            Promise.all(choices.map(e => getAnimationEndPromise(e))).then(d => {
                choicesViewer.appendChild(userChoiceElement);
                choicesViewer.appendChild(myChoiceElement);
                choicesContainer.hidden = true;

                choicesViewer.hidden = false;
                myChoiceElement.classList.remove("disappear");
                userChoiceElement.classList.remove("disappear");

                let winner = getWinner(userChoice, myChoice);
                if (winner > 0) {
                    userChoiceElement.classList.add("winner");
                } else if (winner < 0) {
                    myChoiceElement.classList.add("winner");
                } // 비겼을 때는 아무것도 하지 않음

                document.addEventListener("click", (evt) => location.reload(), { once: true });
            });
            choices.forEach(ele => ele.classList.add("disappear"))
        }

        function getWinner(choice1, choice2) {
            if (choice1 == choice2) return 0;
            let diff = choice2 - choice1;
            let a = diff % 2 == 0;
            if (diff < 0) a = !a;
            return a ? 1 : -1;
        }

        loadChoices();
    </script>
</body>
